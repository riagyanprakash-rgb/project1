<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10142b">
  <title>Contact Us</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: #f8f7ff; background: #10142b; background-image: radial-gradient(ellipse at 18% 15%, #634bba55, transparent 38%), radial-gradient(ellipse at 83% 82%, #11b9b355, transparent 34%); }
    body::before, body::after { content: ""; position: fixed; z-index: -1; width: 24rem; height: 24rem; border: 1px solid #ffffff14; border-radius: 50%; pointer-events: none; }
    body::before { top: -12rem; right: -7rem; box-shadow: 0 0 0 3rem #ffffff08, 0 0 0 6rem #ffffff05; }
    body::after { bottom: -17rem; left: -11rem; width: 32rem; height: 32rem; box-shadow: 0 0 0 3rem #ffffff08, 0 0 0 6rem #ffffff05; }
    .site-header { display: flex; align-items: center; justify-content: space-between; width: min(100% - 3rem, 1080px); margin: auto; padding: 1.4rem 0; }
    .brand { color: #f8f7ff; text-decoration: none; font-weight: 750; letter-spacing: -.04em; }
    .brand span { color: #b6a7ff; }
    nav { display: flex; gap: .4rem; }
    nav a { padding: .65rem .9rem; border: 1px solid transparent; border-radius: 999px; color: #c4c5d8; text-decoration: none; font-size: .9rem; transition: background .2s, color .2s, border-color .2s; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; border-color: #ffffff20; background: #ffffff0d; }
    main { width: min(90vw, 860px); margin: 4rem auto 5rem; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 7vw, 5rem); align-items: start; }
    .eyebrow { margin: 0 0 .8rem; color: #b8b4d8; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 9vw, 6rem); line-height: 1; letter-spacing: -.075em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #a99aff 5%, #f2a9ed 52%, #7ce9dc 100%); background-clip: text; -webkit-background-clip: text; }
    .intro { margin: 1.5rem 0 2rem; color: #b5b8ce; font-size: 1.05rem; line-height: 1.75; }
    .contact-card { padding: 1.4rem; border: 1px solid #ffffff18; border-radius: 1.25rem; background: linear-gradient(145deg, #ffffff10, #ffffff05); }
    .contact-card p { margin: 0 0 .45rem; color: #b5b8ce; font-size: .9rem; }
    .contact-card a { color: #c3b7ff; font-size: 1.05rem; text-decoration-color: #c3b7ff66; text-underline-offset: .2em; overflow-wrap: anywhere; }
    form { display: grid; gap: 1rem; padding: 1.5rem; border: 1px solid #ffffff18; border-radius: 1.25rem; background: linear-gradient(145deg, #ffffff10, #ffffff05); box-shadow: 0 18px 50px #0002; }
    label { display: grid; gap: .5rem; color: #dcdded; font-size: .88rem; font-weight: 600; }
    input, textarea { width: 100%; padding: .85rem 1rem; border: 1px solid #ffffff20; border-radius: .8rem; outline: none; background: #0d1125aa; color: #f8f7ff; font: inherit; }
    input:focus, textarea:focus { border-color: #a99aff; box-shadow: 0 0 0 3px #a99aff24; }
    textarea { min-height: 130px; resize: vertical; }
    button { justify-self: start; padding: .85rem 1.2rem; border: 0; border-radius: 999px; background: linear-gradient(100deg, #a99aff, #e5a8eb 60%, #7ce9dc); color: #17152b; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .note { margin: -.15rem 0 0; color: #9fa3bb; font-size: .78rem; line-height: 1.5; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; margin-top: 3rem; } }
    @media (max-width: 520px) { .site-header { width: min(100% - 2rem, 1080px); padding: 1rem 0; } nav { gap: 0; } nav a { padding: .55rem .65rem; font-size: .82rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">little<span>hello</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </header>
  <main>
    <section>
      <p class="eyebrow">Your turn to say hello</p>
      <h1>Let's talk<span>.</span></h1>
      <p class="intro">Questions, ideas, or a friendly hello are always welcome. Send a note and we’ll be glad to hear from you.</p>
      <div class="contact-card"><p>Prefer email?</p><a href="mailto:hello@littlehello.example">hello@littlehello.example</a></div>
    </section>
    <form action="mailto:hello@littlehello.example" method="post" enctype="text/plain">
      <label for="name">Your name<input id="name" name="name" type="text" autocomplete="name" placeholder="Jane Smith" required></label>
      <label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="jane@example.com" required></label>
      <label for="message">Your message<textarea id="message" name="message" placeholder="What's on your mind?" required></textarea></label>
      <button type="submit">Send a hello <span aria-hidden="true">↗</span></button>
      <p class="note">This opens your email app to send the message.</p>
    </form>
  </main>
</body>
</html>
