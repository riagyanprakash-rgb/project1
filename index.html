<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10142b">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden;
      color: #f8f7ff; background: #10142b;
      background-image: radial-gradient(ellipse at 18% 15%, #634bba55, transparent 38%), radial-gradient(ellipse at 83% 82%, #11b9b355, transparent 34%);
    }
    body::before, body::after { content: ""; position: fixed; width: 24rem; height: 24rem; border: 1px solid #ffffff14; border-radius: 50%; pointer-events: none; }
    body::before { top: -12rem; right: -7rem; box-shadow: 0 0 0 3rem #ffffff08, 0 0 0 6rem #ffffff05; }
    body::after { bottom: -17rem; left: -11rem; width: 32rem; height: 32rem; box-shadow: 0 0 0 3rem #ffffff08, 0 0 0 6rem #ffffff05; }
    main { width: min(90vw, 760px); padding: clamp(2rem, 7vw, 5rem); text-align: center; position: relative; isolation: isolate; }
    .spark { display: inline-grid; place-items: center; width: 4rem; height: 4rem; margin-bottom: 1.6rem; border: 1px solid #ffffff27; border-radius: 1.35rem; background: linear-gradient(145deg, #ffffff20, #ffffff08); box-shadow: 0 12px 40px #0004; font-size: 1.7rem; animation: float 4s ease-in-out infinite; }
    .eyebrow { margin: 0 0 .8rem; color: #b8b4d8; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.4rem, 12vw, 7.4rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #a99aff 5%, #f2a9ed 52%, #7ce9dc 100%); background-clip: text; -webkit-background-clip: text; }
    .subtitle { max-width: 34rem; margin: 1.5rem auto 2rem; color: #b5b8ce; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.7; }
    .badge { display: inline-flex; align-items: center; gap: .55rem; padding: .7rem 1rem; border: 1px solid #ffffff1c; border-radius: 999px; background: #ffffff0b; color: #dcdded; font-size: .85rem; }
    .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #78e6c5; box-shadow: 0 0 12px #78e6c5; }
    @keyframes float { 50% { transform: translateY(-7px) rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1>Hello, <span>world!</span></h1>
    <p class="subtitle">A bright new beginning, wrapped in a few lines of HTML, a splash of color, and a little bit of magic.</p>
    <div class="badge"><span class="dot" aria-hidden="true"></span> All systems go</div>
  </main>
</body>
</html>
